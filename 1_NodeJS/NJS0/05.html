<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultados</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">Resultados dinámicos</h2>

    <table class="table table-bordered table-striped text-center shadow">
        <thead class="table-dark">
            <tr>
                <th>Operación</th>
                <th>Resultado</th>
            </tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>
</div>

<!-- IMPORTANTE: type="module" -->
<script type="module">
    import { suma, resta, multiplicacion, division } from "./calculos.js";

    const operaciones = [
        { op: "4 + 5", res: suma(4, 5) },
        { op: "3 - 6", res: resta(3, 6) },
        { op: "2 * 7", res: multiplicacion(2, 7) },
        { op: "20 / 4", res: division(20, 4) }
    ];

    const tabla = document.getElementById("tabla");

    operaciones.forEach(o => {
        tabla.innerHTML += `
            <tr>
                <td>${o.op}</td>
                <td>${o.res}</td>
            </tr>
        `;
    });
</script>

</body>
</html>
