<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- CLAVE para responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Punto 1 - DOM</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="styles/style.css">
</head>

<body class="bg-dark text-white">

<div class="container py-4">

    <div class="card p-3 p-md-4 shadow-lg bg-secondary text-center">

        <h1 id="titulo" class="mb-4 fs-3 fs-md-1">
            Presioná un botón
        </h1>

        <!-- BOTONES RESPONSIVE -->
        <div class="row g-2">

            <div class="col-12 col-md-4">
                <button class="btn btn-primary w-100" onclick="agregarH1()">Agregar H1</button>
            </div>

            <div class="col-12 col-md-4">
                <button class="btn btn-warning w-100" onclick="cambiarTexto()">Cambiar Texto</button>
            </div>

            <div class="col-12 col-md-4">
                <button class="btn btn-danger w-100" onclick="cambiarColor()">Cambiar Color</button>
            </div>

            <div class="col-12 col-md-4">
                <button class="btn btn-success w-100" onclick="agregarImagen()">Agregar Imagen</button>
            </div>

            <div class="col-12 col-md-4">
                <button class="btn btn-info w-100" onclick="cambiarImagen()">Cambiar Imagen</button>
            </div>

            <div class="col-12 col-md-4">
                <button class="btn btn-dark w-100" onclick="cambiarTamano()">Cambiar Tamaño</button>
            </div>

        </div>

        <div id="contenedorImagen" class="mt-4"></div>

    </div>

</div>

<script src="/scripts/script.js"></script>
</body>
</html>
