<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Carga Profesional</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root[data-theme="light"] {
            --bg-body: #f8f9fa;
            --bg-card: #ffffff;
            --text-main: #212529;
        }
        :root[data-theme="dark"] {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #f8f9fa;
        }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            transition: all 0.3s ease;
        }

        .main-card {
            background-color: var(--bg-card);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 2rem;
            margin-top: 3rem;
        }

        /* Estilo para los números cargados (Chips) */
        .numero-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border-radius: 50px;
            background: #0d6efd;
            color: white;
            transition: transform 0.2s;
        }

        .numero-badge:hover { transform: scale(1.05); }

        .btn-edit { color: #ffca2c; cursor: pointer; border: none; background: none; padding: 0; }
        .btn-del { color: #ff6b6b; cursor: pointer; border: none; background: none; padding: 0; }
        
        .feedback-text { min-height: 20px; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">Gestor de Datos</h2>
            <button id="themeBtn" class="btn btn-outline-secondary btn-sm">🌙 Modo</button>
        </div>

        <!-- Formulario Horizontal con Bootstrap -->
        <div class="row g-3 align-items-center mb-4">
          <div class="row g-3 align-items-center mb-4">
    <div class="col-auto">
        <!-- Etiqueta con estilo Bootstrap: texto sutil y negrita -->
        <label for="inputNum" class="form-label fw-bold text-secondary mb-1">
            <i class="mb-0">Número entero</i> 
        </label>
    </div>
            <div class="col-auto">
                <input type="number" id="inputNum" class="form-control form-control-lg" 
                  placeholder="Máx. 15 dígitos" oninput="if(this.value.length > 15) this.value = this.value.slice(0, 15);">
            </div>
            <div class="col-auto">
                <button id="addBtn" class="btn btn-primary btn-lg px-4">Agregar</button>
            </div>
            <div class="col">
                <div id="liveVal" class="text-danger feedback-text"></div>
            </div>
        </div>

        <hr>

        <!-- Contenedor de Números (Horizontal) -->
        <h5 class="mb-3">Números Cargados (<span id="contador">0</span>/20)</h5>
        <div id="display" class="d-flex flex-wrap gap-2 mb-4">
            <!-- Los números aparecerán aquí -->
        </div>

        <!-- Área de finalización -->
        <div id="actionBox" class="collapse">
            <div class="alert alert-info d-flex justify-content-between align-items-center">
                <span>¡Listo! Ya puedes generar el reporte.</span>
                <button id="saveBtn" class="btn btn-success">Generar .txt</button>
            </div>
            <p id="msg" class="text-center fw-bold mt-2"></p>
        </div>
    </div>
</div>
<!-- Botón "Ir arriba" -->
<button id="scrollToTop" class="btn btn-primary rounded-circle shadow" 
        style="display: none; position: fixed; bottom: 20px; right: 20px; z-index: 1000; width: 50px; height: 50px;">
    ↑
</button>
<script src="../scripts/app.js" type="module"></script>
</body>
</html>
