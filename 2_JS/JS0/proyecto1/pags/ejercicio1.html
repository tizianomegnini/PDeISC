<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 - push()</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container py-5 text-center">

    <h1 class="mb-4">Ejercicio 1 - push()</h1>

    <div class="mb-3">
        <input id="fruta" class="form-control mb-2" placeholder="Agregar fruta">
        <button id="btnFruta" class="btn btn-info w-100">Agregar fruta</button>
    </div>

    <div class="mb-3">
        <input id="amigo" class="form-control mb-2" placeholder="Agregar amigo">
        <button id="btnAmigo" class="btn btn-success w-100">Agregar amigo</button>
    </div>

    <div class="mb-3">
        <input id="numero" type="number" class="form-control mb-2" placeholder="Agregar número">
        <button id="btnNumero" class="btn btn-warning w-100">Agregar número (condición)</button>
    </div>

    <div id="lista" class="mt-4 fs-5"></div>

</div>

<script type="module" src="/scripts/ejercicio1.js"></script>

</body>
</html>
