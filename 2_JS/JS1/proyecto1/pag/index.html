<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario Bancario</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

<div class="container py-5">

  <h1 class="text-center mb-4">Formulario de cuenta bancaria</h1>

  <div class="card bg-secondary p-4 shadow">

    <form id="form" novalidate>

      <div class="row g-3">

        <!-- Nombre -->
        <div class="col-md-6">
          <label class="form-label">Nombre</label>
          <input type="text" id="nombre" name="nombre" class="form-control"
            required pattern="^[A-Za-zÁÉÍÓÚáéíóúñÑ ]+$">
          <div class="invalid-feedback">Solo letras.</div>
        </div>

        <!-- Apellido -->
        <div class="col-md-6">
          <label class="form-label">Apellido</label>
          <input type="text" id="apellido" name="apellido" class="form-control"
            required pattern="^[A-Za-zÁÉÍÓÚáéíóúñÑ ]+$">
          <div class="invalid-feedback">Solo letras.</div>
        </div>

        <!-- DNI -->
        <div class="col-md-6">
          <label class="form-label">DNI</label>
          <input type="text" id="dni" name="dni" class="form-control"
            required pattern="^[0-9]{7,8}$">
          <div class="invalid-feedback">7 u 8 números.</div>
        </div>

        <!-- Email -->
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" id="email" name="email" class="form-control"
            required
            pattern="^[a-zA-Z0-9._%+-]+@(gmail|hotmail)\.com$">
          <div class="invalid-feedback">
            Solo Gmail o Hotmail (ej: usuario@gmail.com)
          </div>
        </div>

        <!-- Teléfono -->
        <div class="col-md-6">
          <label class="form-label">Teléfono</label>
          <input type="text" id="telefono" name="telefono" class="form-control"
            required pattern="^[0-9]{10,15}$">
          <div class="invalid-feedback">Solo números.</div>
        </div>

        <!-- Tipo -->
        <div class="col-md-6">
          <label class="form-label">Tipo de cuenta</label>
          <select id="tipo" name="tipo" class="form-select" required>
            <option value="">Seleccionar...</option>
            <option>Ahorro</option>
            <option>Corriente</option>
          </select>
          <div class="invalid-feedback">Elegí una opción.</div>
        </div>

        <!-- CBU -->
        <div class="col-12">
          <label class="form-label">CBU</label>
          <input type="text" id="cbu" name="cbu" class="form-control"
            required pattern="^[0-9]{22}$">
          <div class="invalid-feedback">22 dígitos.</div>
        </div>

        <!-- Monto -->
        <div class="col-12">
          <label class="form-label">Monto inicial</label>
          <input type="number" id="monto" name="monto" class="form-control"
            required min="1000">
          <div class="invalid-feedback">Mínimo $1000.</div>
        </div>

      </div>

      <button class="btn btn-success w-100 mt-4">Crear Cuenta</button>

    </form>

  </div>

  <div class="mt-5">
    <h3 class="text-center mb-3">Cuentas registradas</h3>
    <ul id="lista" class="list-group"></ul>
  </div>

</div>

<script src="/app.js"></script>

</body>
</html>
